<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Flash Content</title>
    
    <!-- 1. Include the Ruffle library from the official unpkg CDN -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>

    <!-- 2. Create a placeholder container where the Flash content will load -->
    <div id="flash-container" style="width: 800px; height: 600px;"></div>

    <!-- 3. Initialize Ruffle and load your SWF file -->
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            
            // Append the Ruffle player to your container
            const container = document.getElementById("flash-container");
            container.appendChild(player);
            
            // Load your specific .swf file path or URL
            player.load({
                url: "thumb-fighter.swf",
                autoplay: "on"
            });
        });
    </script>

</body>
</html>
